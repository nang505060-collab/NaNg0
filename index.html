<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្តូរសំឡេងវីដេអូជាភាសាខ្មែរ (AI Dubbing)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-indigo-400">ប្រព័ន្ធប្តូរសំឡេងវីដេអូជាភាសាខ្មែរ</h1>
            <p class="text-sm text-slate-400">Upload វីដេអូរបស់អ្នក ទីនេះដើម្បីបកប្រែ និងប្ដូរសំឡេងដោយ AI</p>
        </div>

        <!-- File Upload Input -->
        <div class="space-y-4">
            <input type="file" id="videoFile" accept="video/*" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            
            <button onclick="uploadAndDub()" id="submitBtn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold transition shadow-lg shadow-indigo-600/30">
                ចាប់ផ្តើមប្ដូរសំឡេង (AI Dubbing)
            </button>
        </div>

        <!-- Status & Result -->
        <div id="statusBox" class="hidden text-center text-sm text-indigo-300 animate-pulse">
            កំពុងបញ្ជូនវីដេអូ និងដំណើរការជាមួយ Gemini API... សូមរង់ចាំបន្តិច!
        </div>

        <div id="resultBox" class="hidden space-y-4 border-t border-slate-800 pt-4">
            <h3 class="font-bold text-emerald-400">ជោគជ័យ! វីដេអូរបស់អ្នកត្រូវបានប្ដូរសំឡេងរួចរាល់៖</h3>
            <textarea id="scriptOutput" rows="4" readonly class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-slate-300"></textarea>
            <a id="downloadLink" href="#" class="block text-center py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white transition">
                ទាញយកវីដេអូសំឡេងខ្មែរ (Download Video)
            </a>
        </div>
    </div>

    <script>
        async function uploadAndDub() {
            const fileInput = document.getElementById('videoFile');
            if (fileInput.files.length === 0) {
                alert('សូមជ្រើសរើសឯកសារវីដេអូជាមុនសិន!');
                return;
            }

            const formData = new FormData();
            formData.append('video', fileInput.files[0]);

            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('http://localhost:5000/upload-video', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if(data.success) {
                    document.getElementById('statusBox').classList.add('hidden');
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('scriptOutput').value = data.script;
                    document.getElementById('downloadLink').href = 'http://localhost:5000' + data.download_url;
                } else {
                    alert('មានបញ្ហា៖ ' + data.error);
                    document.getElementById('statusBox').classList.add('hidden');
                }
            } catch (error) {
                alert('កំហុសក្នុងការតភ្ជាប់៖ ' + error);
                document.getElementById('statusBox').classList.add('hidden');
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
