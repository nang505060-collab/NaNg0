<!DOCTYPE html>
<html lang="km" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer AI Speech & Text Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between">
    <div class="max-w-2xl mx-auto p-4 w-full flex-grow">
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-indigo-600">Khmer AI Text-to-Speech</h1>
            <p class="text-sm text-slate-500 mt-1">សរសេរអក្សរខ្មែរដើម្បីស្ដាប់ជាសំឡេង ប្រុស/ស្រី ទាញយក ឬប្រើប្រាស់ Gemini AI ជួយកែច្នៃ</p>
        </header>

        <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div>
                <label for="textInput" class="block text-sm font-medium text-slate-700 mb-1">អត្ថបទភាសាខ្មែរ៖</label>
                <textarea id="textInput" rows="5" class="w-full rounded-xl border border-slate-300 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700" placeholder="បញ្ចូលអត្ថបទរបស់អ្នកទីនេះ..."></textarea>
            </div>

            <!-- Voice Selection -->
            <div>
                <label for="voiceSelect" class="block text-sm font-medium text-slate-700 mb-1">ជ្រើសរើសសំឡេង៖</label>
                <select id="voiceSelect" class="w-full rounded-xl border border-slate-300 p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 bg-white">
                    <option value="">កំពុងទាញយកសំឡេង...</option>
                </select>
            </div>

            <div class="flex flex-wrap gap-2 items-center justify-between pt-2">
                <div class="flex flex-wrap gap-2">
                    <button id="speakBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-medium transition flex items-center gap-1.5 shadow-sm">
                        <span>🔊 និយាយ</span>
                    </button>
                    <button id="stopBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-medium transition">
                        ឈប់
                    </button>
                    <button id="downloadBtn" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl font-medium transition flex items-center gap-1.5 shadow-sm">
                        📥 ទាញយកសំឡេង
                    </button>
                </div>
                <button id="aiEnhanceBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-medium transition flex items-center gap-1.5 shadow-sm">
                    ✨ កែច្នៃដោយ Gemini AI
                </button>
            </div>
        </main>
    </div>

    <footer class="text-center py-4 text-xs text-slate-400">
        &copy; 2026 Khmer AI Assistant. រក្សាសិទ្ធិគ្រប់យ៉ាង។
    </footer>

    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const aiEnhanceBtn = document.getElementById('aiEnhanceBtn');
        const voiceSelect = document.getElementById('voiceSelect');

        const geminiApiKey = "AQ.Ab8RN6JNHhMKkwA5uB45idQcc3hyPi_VKljYbdxLvzfjueqRpA";

        let voices = [];

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            
            // Filter Khmer voices or fallback to general voices
            let khmerVoices = voices.filter(v => v.lang.includes('km') || v.lang.includes('KH'));
            if (khmerVoices.length === 0) {
                khmerVoices = voices; // fallback if specific Khmer voice is not installed on device
            }

            khmerVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = voices.indexOf(voice);
                
                // Guess gender based on voice name if available
                let genderLabel = '';
                const nameLower = voice.name.toLowerCase();
                if (nameLower.includes('female') || nameLower.includes('girl') || nameLower.includes('sreynich') || nameLower.includes('kanha')) {
                    genderLabel = ' (សំឡេងស្រី ♀)';
                } else if (nameLower.includes('male') || nameLower.includes('boy') || nameLower.includes('piseth') || nameLower.includes('dara')) {
                    genderLabel = ' (សំឡេងប្រុស ♂)';
                }

                option.textContent = `${voice.name} ${genderLabel} [${voice.lang}]`;
                voiceSelect.appendChild(option);
            });

            if (voiceSelect.options.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'រកមិនឃើញសំឡេងក្នុងប្រព័ន្ធទេ';
                voiceSelect.appendChild(option);
            }
        }

        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Speech function
        function speakText(text) {
            if (!text.trim()) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            const selectedVoiceIndex = voiceSelect.value;
            if (selectedVoiceIndex !== "" && voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        speakBtn.addEventListener('click', () => {
            speakText(textInput.value);
        });

        stopBtn.addEventListener('click', () => {
            window.speechSynthesis.cancel();
        });

        // Download functionality using MediaRecorder API / Speech Synthesis stream workaround or text notification
        downloadBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
                return;
            }
            
            // Browser security restricts direct mp3 conversion from Web Speech API directly without backend TTS.
            // We will trigger speech and offer a friendly prompt or helper instruction for recording/downloading.
            alert('មុខងារទាញយកជាไฟล์អូឌីយ៉ូ៖ ប្រព័ន្ធកំពុងអានអត្ថបទ សូមប្រើប្រាស់แอป Screen Recorder ឬ Web Audio API ជំនួសមុខងារ Export ផ្ទាល់ក្នុង browser។');
            speakText(text);
        });

        // AI Enhance using Gemini API
        aiEnhanceBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
                return;
            }

            aiEnhanceBtn.disabled = true;
            aiEnhanceBtn.textContent = 'กำลังដំណើរការ...';

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `ជួយកែសម្រួលនិងពង្រីកអត្ថបទភាសាខ្មែរនេះឱ្យពីរោះ និងងាយស្រួលស្ដាប់ជាសំឡេង៖ ${text}` }]
                        }]
                    })
                });

                const data = await res.json();
                const aiResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiResponseText) {
                    textInput.value = aiResponseText;
                    speakText(aiResponseText);
                } else {
                    alert('មានបញ្ហាក្នុងការទាក់ទងទៅ Gemini API');
                }
            } catch (error) {
                console.error(error);
                alert('មានបញ្ហាបច្ចេកទេសកើតឡើង។');
            } finally {
                aiEnhanceBtn.disabled = false;
                aiEnhanceBtn.innerHTML = '✨ កែច្នៃដោយ Gemini AI';
            }
        });
    </script>
</body>
</html>
